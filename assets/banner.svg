<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(180deg)}}@keyframes dashStream{0%{stroke-dashoffset:100}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:52px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.particle,.pulsing-bg{transform-origin:center}.pulsing-bg{animation:pulseGlow 6s infinite ease-in-out}.particle{animation:floatParticle 8s infinite ease-in-out}.stream-line{stroke-dasharray:10 15;animation:dashStream 4s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="180" fill="url(#glow)" class="pulsing-bg"/><circle cx="1000" cy="300" r="220" fill="url(#glow)" class="pulsing-bg" style="animation-delay:-3s"/><path fill="none" stroke="url(#primaryGrad)" 